server {
    listen 80;
    server_name api.chungs.store;

    # 인증서 갱신은 webroot 방식이라 이 경로만 리다이렉트에서 제외한다.
    # standalone 방식이면 갱신할 때마다 nginx를 내려야 한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.chungs.store;

    ssl_certificate /etc/letsencrypt/live/api.chungs.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chungs.store/privkey.pem;

    # 업로드 상한(요청 전체 22MB)보다 커야 한다
    client_max_body_size 25M;

    # app 컨테이너가 교체되면 IP가 바뀌므로 도커 DNS를 다시 해석하게 한다
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # 파일·ZIP 다운로드가 스트리밍이라 버퍼링하면 전송이 끝날 때까지 지연된다
        proxy_buffering off;
        # AI 응답은 외부 호출을 기다려 기본 60초로는 짧다
        proxy_read_timeout 120s;
    }
}
