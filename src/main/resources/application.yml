spring:
  application:
    name: moimzang

  # 로컬 실행 시 비밀값은 .env에서 읽는다(.env는 KEY=VALUE라 properties로 그대로 파싱됨).
  # optional: 이므로 파일이 없어도 기동되고, 운영에서는 실제 환경변수가 이 값을 덮는다.
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moimzang}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway가 정본. update/create로 바꾸지 않는다
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # 프론트 배포 주소가 정해지면 환경변수만 바꾼다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  ai:
    # gemini | openai — 키 있는 쪽으로 설정값만 바꿔서 전환한다. 둘 다 코드에 항상 같이 있다
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:30000}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:30000}

  # 영수증 인식(API-036) 전용 OpenAI 호출 설정 — api-key는 위 app.ai.openai 걸 그대로 쓰고
  # model만 분리한다(meeting이 쓰는 app.ai.openai.model과 독립적으로 바꿀 수 있어야 해서).
  # 새 환경변수를 늘리지 않기로 해서(사용자 결정) 값은 리터럴로 두고, 바꾸려면 이 파일을 고친다
  ocr:
    openai:
      model: gpt-4o-mini
      base-url: https://api.openai.com
      connect-timeout-ms: 10000
      read-timeout-ms: 30000

  storage:
    # local | s3 — 배포 시 환경변수만 바꿔서 전환
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${UPLOAD_DIR:./uploads}
      base-url: ${UPLOAD_BASE_URL:/uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      base-url: ${AWS_S3_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.moimzang: debug
