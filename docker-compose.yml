services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot이 nginx를 세우지 않고 갱신할 수 있게 ACME 챌린지 경로를 공유한다
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: ${IMAGE_URI}
    # 외부에는 nginx만 노출한다. 루프백 바인딩은 배포 스크립트가 호스트에서
    # /health를 찔러 기동을 확인하기 위한 것이다
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.app
    restart: unless-stopped
