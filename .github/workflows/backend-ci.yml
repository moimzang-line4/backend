name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  # develop push은 제외한다 — deploy.yml의 test-and-build 잡이 같은 테스트를 이미 돌리므로
  # 같은 커밋에서 두 번 실행되는 걸 막는다. main은 배포 트리거가 없어 여기서 검증한다
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # DB 서비스 컨테이너를 두지 않는다 — 테스트가 @ServiceConnection으로 MySQL
    # Testcontainer를 직접 띄우고, 러너에는 도커가 이미 있다.
    # application.yml의 spring.datasource.username/password에는 기본값이 없어서
    # 전체 컨텍스트를 로드하는 테스트가 생기면 플레이스홀더 해석에서 터진다 — 더미를 넣어둔다
    env:
      DB_USERNAME: ci
      DB_PASSWORD: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: moimzang-be-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
